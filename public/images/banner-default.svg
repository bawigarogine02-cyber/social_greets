<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="Share a joyful greeting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="0.45" stop-color="#FF6B9D"/>
      <stop offset="1" stop-color="#5EC8D8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" rx="28" fill="url(#bg)"/>
  <circle cx="140" cy="50" r="36" fill="#FFE66D" opacity="0.9"/>
  <circle cx="1080" cy="220" r="50" fill="#FFF" opacity="0.18"/>
  <circle cx="980" cy="40" r="22" fill="#FFF176"/>
  <text x="80" y="120" font-family="Nunito, Arial, sans-serif" font-size="42" font-weight="800" fill="#fff">Send smiles across the room.</text>
  <text x="80" y="168" font-family="Nunito, Arial, sans-serif" font-size="22" fill="#fffef7">Banner a public hello or keep it private for someone special.</text>
  <rect x="80" y="196" width="220" height="44" rx="22" fill="#fff"/>
